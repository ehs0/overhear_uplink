[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "overhear-uplink"
version = "0.1.0"
description = "Learned sequential multi-view image coding with perfect overhearing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1",
  "Pillow>=10.0",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

